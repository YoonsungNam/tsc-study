name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege GITHUB_TOKEN: CI only needs to read code.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Placeholders at job scope so SvelteKit's $env/static/public imports
    # resolve in BOTH `svelte-kit sync` (typecheck) and `vite build`. Without
    # this, future code that imports from $env/static/public would break the
    # typecheck step even though the build step has placeholders.
    # Real values are injected at deploy time (Vercel).
    env:
      PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prettier (lint)
        run: npm run lint

      - name: SvelteKit sync + typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
